<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>capsule</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="art"></canvas>
  <script type="module">
    // Arte de capa cinematografica: o presidente em silhueta na superficie, contra a luz da explosao nuclear,
    // com o Vault em corte logo abaixo. Usa as camadas e o motor do proprio jogo; o logo e desenhado aqui.
    import { AssetManager, DEFAULT_ASSETS, drawPresident, renderSpriteScene } from '../../../src/core/sprite_engine.js';
    import { buildInhabitants, buildVaultGrid } from './vault.js';

    const params = new URLSearchParams(location.search);
    const W = Number(params.get('w') ?? 920);
    const H = Number(params.get('h') ?? 430);
    const preset = params.get('preset') ?? 'header';
    const canvas = document.getElementById('art');
    canvas.width = W;
    canvas.height = H;
    let ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';

    await document.fonts.load('64px "Press Start 2P"');
    await document.fonts.load('32px "Share Tech Mono"');
    const assetUrls = Object.fromEntries(Object.entries(DEFAULT_ASSETS).map(([key, url]) => [key, new URL(url, `${location.origin}/`).href]));
    const assets = await new AssetManager(assetUrls).preload();

    // horizon: altura do chao (fracao de H); blast: centro da explosao; figure: silhueta do presidente (altura em fracao de H);
    // bunker: escala do corte do Vault; logo.width: fracao de W ocupada pela palavra PRESIDENTE (fonte monoespacada).
    const LAYOUTS = {
      header: { horizon: .6, blast: { x: .76, size: .3 }, figure: { x: .62, height: .3 }, bunker: .62,
        logo: { x: .045, y: .19, width: .54, align: 'left' } },
      small: { horizon: .74, blast: { x: .82, size: .4 }, figure: null, bunker: .45,
        logo: { x: .5, y: .16, width: .84, align: 'center', tagline: false } },
      main: { horizon: .58, blast: { x: .74, size: .3 }, figure: { x: .6, height: .3 }, bunker: .8,
        logo: { x: .05, y: .17, width: .5, align: 'left' } },
      vertical: { horizon: .6, blast: { x: .66, size: .22 }, figure: { x: .27, height: .24 }, bunker: .78,
        logo: { x: .5, y: .06, width: .84, align: 'center' } },
      library: { horizon: .6, blast: { x: .66, size: .22 }, figure: { x: .27, height: .22 }, bunker: .7,
        logo: { x: .5, y: .055, width: .86, align: 'center' } },
      hero: { horizon: .66, blast: { x: .7, size: .34 }, figure: { x: .56, height: .28 }, bunker: 1, logo: null },
      background: { horizon: .58, blast: { x: .5, size: .3 }, figure: null, bunker: .8, logo: null, dim: .5 },
      keyart: { horizon: .6, blast: { x: .72, size: .32 }, figure: { x: .58, height: .27 }, bunker: 1,
        logo: { x: .05, y: .16, width: .44, align: 'left' } },
      twitter: { horizon: .66, blast: { x: .78, size: .38 }, figure: { x: .66, height: .34 }, bunker: .7,
        logo: { x: .04, y: .2, width: .46, align: 'left' } },
      square: { horizon: .62, blast: { x: .68, size: .19 }, figure: { x: .28, height: .24 }, bunker: .82,
        logo: { x: .5, y: .06, width: .82, align: 'center' } },
      logo: { logoOnly: true, logo: { x: .5, y: .28, width: .84, align: 'center', tagline: false } },
    };
    const layout = LAYOUTS[preset] ?? LAYOUTS.header;
    const horizonY = H * (layout.horizon ?? .6);
    const unit = Math.min(W, H * 1.6);

    function seeded(seed) {
      let value = seed >>> 0 || 1;
      return () => {
        value = (Math.imul(value, 1_103_515_245) + 12_345) >>> 0;
        return value / 4_294_967_296;
      };
    }

    function coverImage(image, x, y, width, height, focusY = .5) {
      if (!image) return;
      const scale = Math.max(width / image.width, height / image.height);
      const sw = width / scale;
      const sh = height / scale;
      ctx.drawImage(image, (image.width - sw) / 2, (image.height - sh) * focusY, sw, sh, x, y, width, height);
    }

    function puff(x, y, radius, inner, outer) {
      const gradient = ctx.createRadialGradient(x - radius * .25, y - radius * .3, radius * .05, x, y, radius);
      gradient.addColorStop(0, inner);
      gradient.addColorStop(.45, outer);
      gradient.addColorStop(1, outer.replace(/[\d.]+\)$/, '0)'));
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function mix(a, b, t) { return a.map((value, index) => Math.round(value + (b[index] - value) * t)); }
    const rgba = (color, alpha) => `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;

    // Cogumelo nuclear em camadas: clarao no ceu, tronco turbulento aquecido em cima, saia de poeira na base
    // e capa toroidal escura no topo, iluminada por baixo pela bola de fogo.
    function drawMushroom(cx, groundY, size) {
      const random = seeded(7_331);
      const capY = groundY - size * 2.1;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalCompositeOperation = 'source-over';
      const soot = [58, 30, 24];
      const ember = [255, 150, 60];
      for (let index = 0; index < 120; index++) {
        const t = index / 119;
        const y = groundY - t * (groundY - capY) * .95;
        const width = size * (.24 - .1 * Math.sin(t * Math.PI) + (t > .8 ? (t - .8) * 1.3 : 0));
        const x = cx + (random() - .5) * width * .9;
        const heat = Math.pow(t, 2.2) * .85 + random() * .1;
        const color = mix(soot, ember, heat);
        puff(x, y, width * (.55 + random() * .6), rgba(mix(color, [255, 230, 190], heat * .4), 1), rgba(mix(color, soot, .25), .95));
      }
      for (let index = 0; index < 34; index++) {
        const side = random() > .5 ? 1 : -1;
        const x = cx + side * size * (.2 + random() * 1.3);
        const y = groundY - random() * size * .3;
        puff(x, y, size * (.16 + random() * .2), 'rgba(170, 110, 80, .45)', 'rgba(80, 46, 34, .35)');
      }
      const fire = ctx.createRadialGradient(cx, capY + size * .22, size * .05, cx, capY + size * .2, size * .95);
      fire.addColorStop(0, 'rgba(255, 252, 230, 1)');
      fire.addColorStop(.4, 'rgba(255, 190, 90, .95)');
      fire.addColorStop(1, 'rgba(255, 110, 40, 0)');
      ctx.fillStyle = fire;
      ctx.beginPath();
      ctx.ellipse(cx, capY + size * .2, size * .95, size * .55, 0, 0, Math.PI * 2);
      ctx.fill();
      const ring = [];
      for (let index = 0; index < 420; index++) {
        const angle = random() * Math.PI * 2;
        const radial = .25 + Math.sqrt(random()) * .8;
        const x = cx + Math.cos(angle) * size * 1.05 * radial;
        const y = capY + Math.sin(angle) * size * .42 * radial - random() * size * .4;
        ring.push({ x, y, radius: size * (.09 + random() * .13) });
      }
      ring.sort((a, b) => a.y - b.y);
      for (const cell of ring) {
        const lit = Math.min(1, Math.max(0, (cell.y - (capY - size * .5)) / (size * .9)));
        const color = mix([52, 24, 22], [255, 168, 80], Math.pow(lit, 1.4));
        puff(cell.x, cell.y, cell.radius, rgba(mix(color, [255, 225, 170], lit * .3), 1), rgba(color, .96));
      }
      const core = ctx.createRadialGradient(cx, capY + size * .3, 0, cx, capY + size * .28, size * .6);
      core.addColorStop(0, 'rgba(255, 240, 200, .7)');
      core.addColorStop(1, 'rgba(255, 140, 50, 0)');
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.ellipse(cx, capY + size * .28, size * .6, size * .45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawGodRays(cx, cy, length) {
      const random = seeded(99);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let index = 0; index < 22; index++) {
        const angle = Math.PI * (1.05 + random() * .9);
        const spread = .015 + random() * .03;
        const ray = ctx.createRadialGradient(cx, cy, 0, cx, cy, length);
        ray.addColorStop(0, 'rgba(255, 210, 140, .16)');
        ray.addColorStop(1, 'rgba(255, 160, 80, 0)');
        ctx.fillStyle = ray;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, length, angle - spread, angle + spread);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawAsh(count, maxY) {
      const random = seeded(4242);
      ctx.save();
      for (let index = 0; index < count; index++) {
        const x = random() * W;
        const y = random() * maxY;
        const size = (.5 + random() * 1.6) * Math.max(1, unit / 900);
        const ember = random() > .7;
        ctx.globalAlpha = .2 + random() * .55;
        ctx.fillStyle = ember ? '#ffb347' : '#d8c2a8';
        if (ember) { ctx.shadowColor = '#ff8a2a'; ctx.shadowBlur = 5; } else ctx.shadowBlur = 0;
        ctx.fillRect(x, y, size, size);
      }
      ctx.restore();
    }

    function drawSurface() {
      const sky = assets.getImage('bg_sky');
      const mountains = assets.getImage('bg_mountains');
      const ruins = assets.getImage('fg_wasteland');
      coverImage(sky, 0, 0, W, horizonY + H * .02, .7);
      const smoke = ctx.createLinearGradient(0, 0, 0, horizonY);
      smoke.addColorStop(0, 'rgba(18, 8, 10, .78)');
      smoke.addColorStop(.45, 'rgba(40, 14, 8, .35)');
      smoke.addColorStop(1, 'rgba(40, 14, 8, 0)');
      ctx.fillStyle = smoke;
      ctx.fillRect(0, 0, W, horizonY);
      if (layout.blast) {
        // A capa (~2.8x o raio acima do chao) precisa caber abaixo do topo da imagem.
        const size = Math.min(unit * layout.blast.size * .5, (horizonY - H * .05 - H * .05) / 2.85);
        const blastX = W * layout.blast.x;
        const capY = horizonY - H * .05 - size * 2.1;
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const flash = ctx.createRadialGradient(blastX, capY, size * .2, blastX, capY, size * 3.6);
        flash.addColorStop(0, 'rgba(255, 220, 150, .55)');
        flash.addColorStop(.3, 'rgba(255, 140, 60, .3)');
        flash.addColorStop(1, 'rgba(120, 30, 10, 0)');
        ctx.fillStyle = flash;
        ctx.fillRect(0, 0, W, horizonY);
        ctx.restore();
        drawGodRays(blastX, capY, unit * .9);
        // O cogumelo vai para uma camada propria: uma copia desfocada funde as nuvens e a nitida por cima guarda o volume.
        const main = ctx;
        const layer = document.createElement('canvas');
        layer.width = W;
        layer.height = H;
        ctx = layer.getContext('2d');
        drawMushroom(W * layout.blast.x, horizonY - H * .05, size);
        ctx = main;
        ctx.save();
        ctx.filter = `blur(${Math.max(1, size * .028)}px)`;
        ctx.drawImage(layer, 0, 0);
        ctx.filter = 'none';
        ctx.globalAlpha = .45;
        ctx.drawImage(layer, 0, 0);
        ctx.restore();
      }
      const bandHeight = Math.max(H * .24, horizonY * .4);
      coverImage(mountains, 0, horizonY - bandHeight, W, bandHeight * 1.04, .45);
      const haze = ctx.createLinearGradient(0, horizonY - bandHeight, 0, horizonY);
      haze.addColorStop(0, 'rgba(255, 140, 60, 0)');
      haze.addColorStop(1, 'rgba(255, 110, 40, .14)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizonY - bandHeight, W, bandHeight);
      const ruinsHeight = Math.max(H * .14, bandHeight * .55);
      coverImage(ruins, 0, horizonY - ruinsHeight * .86, W, ruinsHeight, .6);
      if (layout.blast) {
        const glow = ctx.createRadialGradient(W * layout.blast.x, horizonY, 0, W * layout.blast.x, horizonY, W * .6);
        glow.addColorStop(0, 'rgba(255, 150, 60, .35)');
        glow.addColorStop(1, 'rgba(255, 150, 60, 0)');
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = glow;
        ctx.fillRect(0, horizonY - ruinsHeight, W, ruinsHeight * 1.4);
        ctx.restore();
      }
    }

    function drawBunker() {
      const depth = H - horizonY;
      if (depth < 8) return;
      const grid = buildVaultGrid();
      const inhabitants = buildInhabitants(grid);
      const scale = Math.max(.35, Math.min(1.15, (depth / 470) * (layout.bunker ?? .8)));
      const off = document.createElement('canvas');
      off.width = Math.ceil(W / scale);
      off.height = Math.ceil(depth / scale) + 8;
      const view = off.getContext('2d');
      const worldCenter = 60 + 3.6 * 264;
      const camera = { offset_x: off.width / 2 - worldCenter, offset_y: -146 + 4 };
      renderSpriteScene(view, { grid, player: { x: -999, y: -999, floor: 0, vx: 0, facing: 1, liftTarget: null },
        camera, assets, inhabitants, cabinFloor: 0, time: 900, isNight: false, activeGenerators: 4, weather: 'clear',
        presidentClass: 'survivor', equippedSkin: 'default' });
      ctx.drawImage(off, 0, 0, off.width, depth / scale, 0, horizonY, W, depth);
      const shade = ctx.createLinearGradient(0, horizonY, 0, H);
      shade.addColorStop(0, 'rgba(0, 0, 0, 0)');
      shade.addColorStop(.75, 'rgba(6, 3, 1, .25)');
      shade.addColorStop(1, 'rgba(6, 3, 1, .7)');
      ctx.fillStyle = shade;
      ctx.fillRect(0, horizonY, W, depth);
      const seam = ctx.createLinearGradient(0, horizonY - 4, 0, horizonY + 10);
      seam.addColorStop(0, 'rgba(255, 150, 60, 0)');
      seam.addColorStop(.5, 'rgba(255, 150, 60, .4)');
      seam.addColorStop(1, 'rgba(255, 150, 60, 0)');
      ctx.fillStyle = seam;
      ctx.fillRect(0, horizonY - 4, W, 14);
    }

    // Presidente na superficie: silhueta escura com contorno alaranjado do lado da explosao e sombra longa no chao.
    function drawFigure() {
      if (!layout.figure) return;
      const height = Math.min(H * layout.figure.height, 470);
      const x = W * layout.figure.x;
      const feetY = horizonY - H * .012;
      const facing = layout.blast && layout.blast.x < layout.figure.x ? -1 : 1;
      const pad = height * .2;
      const off = document.createElement('canvas');
      off.width = Math.ceil(height * .75 + pad * 2);
      off.height = Math.ceil(height + pad * 2);
      const view = off.getContext('2d');
      drawPresident(view, { x: off.width / 2, y: off.height - pad, vx: 0, facing, role: 'president' }, assets,
        { presidentClass: 'survivor', equippedSkin: 'default', time: 0, placement: { height } });
      const left = x - off.width / 2;
      const top = feetY - (off.height - pad);
      ctx.save();
      ctx.globalAlpha = .45;
      ctx.translate(x, feetY);
      ctx.scale(facing === 1 ? -1.6 : 1.6, .12);
      ctx.filter = 'blur(3px) brightness(0)';
      ctx.drawImage(off, -off.width / 2, -(off.height - pad));
      ctx.restore();
      const silhouette = document.createElement('canvas');
      silhouette.width = off.width;
      silhouette.height = off.height;
      const shadowView = silhouette.getContext('2d');
      shadowView.filter = 'brightness(.2) saturate(.6)';
      shadowView.drawImage(off, 0, 0);
      shadowView.filter = 'none';
      shadowView.globalCompositeOperation = 'source-atop';
      const rim = shadowView.createLinearGradient(facing === 1 ? silhouette.width : 0, 0, facing === 1 ? silhouette.width * .55 : silhouette.width * .45, 0);
      rim.addColorStop(0, 'rgba(255, 190, 100, 1)');
      rim.addColorStop(.3, 'rgba(255, 130, 50, .55)');
      rim.addColorStop(1, 'rgba(255, 120, 40, 0)');
      shadowView.fillStyle = rim;
      shadowView.fillRect(0, 0, silhouette.width, silhouette.height);
      ctx.save();
      ctx.shadowColor = 'rgba(255, 140, 50, .55)';
      ctx.shadowBlur = Math.max(4, height * .03);
      ctx.drawImage(silhouette, left, top);
      ctx.restore();
    }

    function drawTrefoil(x, y, radius) {
      ctx.save();
      ctx.fillStyle = '#1a0d00';
      ctx.beginPath();
      ctx.arc(x, y, radius * 1.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffc23a';
      ctx.shadowColor = '#ff9a2a';
      ctx.shadowBlur = radius * .4;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#1a0d00';
      for (let blade = 0; blade < 3; blade++) {
        const angle = -Math.PI / 2 + blade * (Math.PI * 2 / 3);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.arc(x, y, radius * .82, angle - .5, angle + .5);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#ffc23a';
      ctx.beginPath();
      ctx.arc(x, y, radius * .24, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a0d00';
      ctx.beginPath();
      ctx.arc(x, y, radius * .14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawTitleLine(text, x, y, size, align) {
      ctx.save();
      ctx.font = `${size}px "Press Start 2P"`;
      ctx.textAlign = align;
      ctx.textBaseline = 'top';
      ctx.lineJoin = 'round';
      ctx.fillStyle = '#120700';
      for (let step = 1; step <= Math.max(3, Math.round(size * .12)); step++) ctx.fillText(text, x + step, y + step);
      ctx.strokeStyle = '#1a0d00';
      ctx.lineWidth = size * .22;
      ctx.strokeText(text, x, y);
      const fill = ctx.createLinearGradient(0, y, 0, y + size);
      fill.addColorStop(0, '#fff2b0');
      fill.addColorStop(.45, '#ffc23a');
      fill.addColorStop(1, '#ff6a14');
      ctx.fillStyle = fill;
      ctx.shadowColor = 'rgba(255, 140, 40, .65)';
      ctx.shadowBlur = size * .35;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // Logo: "SIMULADOR DE" + "PRESIDENTE" em pixel art com contorno, degrade ambar e brilho; tagline em fonte de terminal.
    function drawLogo(spec) {
      if (!spec) return;
      const big = Math.round(W * spec.width / 10);
      const small = Math.round(big * .58);
      const x = W * spec.x;
      const y = H * spec.y;
      const align = spec.align;
      const topWidth = small * 12 + small * 1.5;
      const topLeft = align === 'left' ? x : x - topWidth / 2;
      drawTrefoil(topLeft + small * .6, y + small * .5, small * .6);
      drawTitleLine('SIMULADOR DE', topLeft + small * 1.5, y, small, 'left');
      drawTitleLine('PRESIDENTE', x, y + small * 1.5, big, align);
      if (spec.tagline === false) return;
      const tagSize = Math.max(11, Math.round(big * .34));
      const tagY = y + small * 1.5 + big * 1.4;
      ctx.save();
      ctx.font = `${tagSize}px "Share Tech Mono"`;
      ctx.textAlign = align;
      ctx.textBaseline = 'top';
      const tag = 'GOVERNE · APERTE O BOTÃO · SOBREVIVA NO VAULT';
      const tagWidth = ctx.measureText(tag).width;
      const lineX = align === 'left' ? x : x - tagWidth / 2;
      ctx.fillStyle = 'rgba(10, 5, 0, .55)';
      ctx.fillRect(lineX - tagSize * .5, tagY - tagSize * .35, tagWidth + tagSize, tagSize * 1.7);
      ctx.fillStyle = '#ffd88a';
      ctx.shadowColor = 'rgba(255, 140, 40, .7)';
      ctx.shadowBlur = tagSize * .5;
      ctx.fillText(tag, x, tagY);
      ctx.fillStyle = '#ff9a2a';
      ctx.fillRect(lineX - tagSize * .5, tagY + tagSize * 1.35, tagWidth + tagSize, Math.max(1, tagSize * .1));
      ctx.restore();
    }

    if (layout.logoOnly) {
      drawLogo(layout.logo);
    } else {
      drawSurface();
      drawBunker();
      drawFigure();
      drawAsh(Math.round(W * H / 7000), horizonY);
      if (layout.dim) {
        ctx.fillStyle = `rgba(0, 0, 0, ${layout.dim})`;
        ctx.fillRect(0, 0, W, H);
      }
      const vignette = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .4, W / 2, H * .45, Math.max(W, H) * .8);
      vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vignette.addColorStop(1, 'rgba(0, 0, 0, .5)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);
      if (layout.logo?.align === 'left') {
        const scrim = ctx.createLinearGradient(0, 0, W * .6, 0);
        scrim.addColorStop(0, 'rgba(8, 3, 0, .55)');
        scrim.addColorStop(1, 'rgba(8, 3, 0, 0)');
        ctx.fillStyle = scrim;
        ctx.fillRect(0, 0, W * .6, horizonY);
      }
      drawLogo(layout.logo);
    }
    document.title = 'ready';
  </script>
</body>
</html>
